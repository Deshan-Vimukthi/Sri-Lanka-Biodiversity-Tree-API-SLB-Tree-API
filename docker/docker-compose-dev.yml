version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-springboot
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: slb_tree_db
      MYSQL_USER: Kuveni
      MYSQL_PASSWORD: Kuveni@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis-springboot
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: springboot-app
    ports:
      - "8081:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DATABASE_NAME: slb_tree_db
      DATABASE_USERNAME: Kuveni
      DATABASE_PASSWORD: Kuveni@123
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  mysql_data:
